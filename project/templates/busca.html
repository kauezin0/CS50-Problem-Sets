{% extends "layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block main %}
    <form action="/" method="post">
        <input name="caixa" type="text" placeholder="Search...">
        <button type="submit">Search</button>
    </form>

    <hr> {% if games %}
        <table class="table table-dark">
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                {% for game in games %}
                <tr>
                    <td><img src="/static/img/{{ game.id }}.jpg" width="100"></td>
                    <td>
                        <h3>{{ game.nome }}</h3>
                        <p>Difficulty: {{ game.dificuldade }}</p>
                        <p>History mode: {{ game.historia }}h</p>
                        <p>100%: {{ game.completo }}h</p>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endif %}
    {% endblock %}
