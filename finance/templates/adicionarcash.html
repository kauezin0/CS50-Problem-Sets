{% extends "layout.html" %}

{% block title %}
    Add Cash
{% endblock %}

{% block main %}
    <form action="/cash" method="post">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="cash" placeholder="Add cash" type="number" min="1" max="100000" step="0.01">
        <button class="btn btn-primary" type="submit">Add</button>
    </form>
{% endblock %}
