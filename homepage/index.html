<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                let card = document.querySelectorAll(".card");
                for (let i = 0; i < card.length; i++) {
                    card[i].addEventListener('mouseenter', function() {
                        this.style.transform= "scale(1.1)";
                    });

                    card[i].addEventListener('mouseleave', function() {
                        this.style.transform= "scale(1.0)";
                    });
                }
            });
        </script>
        <title>Monkeys</title>
    </head>
    <body>
        <h1 id ="titulo-macaco">Monkeys</h1>
        <div class="container">
            <div class="row justify-content-center"> <div class="col-md-2"> <div class="card">
                        <img class="card-img-top" src="macacos_fotos/babuinobonito.jpg">
                        <div class="card-body text-center">
                            <h5 class="card-title">Baboon</h5>
                            <a href="babuino.html" class="btn btn-dark">Ver Detalhes</a>
                        </div>
                    </div></div>

                    <div class="col-md-2"> <div class="card">
                        <img class="card-img-top" src="macacos_fotos/macaco-preguinho.jpg">
                        <div class="card-body text-center">
                            <h5 class="card-title">Capuchin Monkey</h5>
                            <a href="macaco-prego.html" class="btn btn-dark">Ver Detalhes</a>
                        </div>
                    </div></div>

                    <div class="col-md-2"> <div class="card">
                        <img class="card-img-top" src="macacos_fotos/9.jpg">
                        <div class="card-body text-center">
                            <h5 class="card-title">Orangutan</h5>
                            <a href="orangotango.html" class="btn btn-dark">Ver Detalhes</a>
                        </div>
                    </div></div>

            </div>
        </div>
    </body>
</html>
